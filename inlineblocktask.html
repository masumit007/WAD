<!DOCTYPE html>
<html>
<head>
    <title>CSS Display and Box Model Demo</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 20px;
        }

        /* Block Layout */
        .container{
            display: block;
            width: 80%;
            margin: auto;
            border: 3px solid black;
            padding: 20px;
            background-color: white;
        }

        /* Box Model */
        .content-box{
            display: block;
            width: 90%;
            margin: 20px auto;
            padding: 20px;
            border: 2px solid blue;
            background-color: lightyellow;
            text-align: justify;
        }

        /* Heading */
        h2{
            text-align: center;
            text-transform: uppercase;
            text-decoration: underline;
        }

        /* Paragraph */
        p{
            text-transform: capitalize;
            line-height: 1.6;
        }

        /* Navigation */
        .nav{
            text-align: center;
            margin-top: 20px;
        }

        .nav a{
            display: inline-block;
            width: 120px;
            padding: 10px;
            margin: 5px;
            background-color: orange;
            color: white;
            text-decoration: none;
            text-transform: uppercase;
            border: 2px solid black;
        }

        /* Hover Effect */
        .nav a:hover{
            background-color: green;
            color: yellow;
            text-decoration: underline;
        }

        /* Visited Link */
        .nav a:visited{
            background-color: purple;
            color: white;
        }

    </style>
</head>

<body>

    <div class="container">

        <h2>CSS Display and Box Model</h2>

        <div class="content-box">
            <p>
                This box demonstrates the CSS Box Model. It contains
                margin, border, padding, and content. The heading uses
                text decoration and uppercase transformation, while this
                paragraph uses capitalize transformation.
            </p>
        </div>

        <div class="nav">
            <a href="https://www.google.com" target="_blank">Home</a>
            <a href="https://www.wikipedia.org" target="_blank">About</a>
            <a href="https://www.github.com" target="_blank">Services</a>
            <a href="https://www.youtube.com" target="_blank">Contact</a>
        </div>

    </div>

</body>
</html>
