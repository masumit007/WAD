<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Profile Card</title>

<style>

body{
    background:#f2f2f2;
    font-family:Arial,sans-serif;
}

.container{
    width:500px;
    margin:40px auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.3);
}

h1{
    text-align:center;
    color:darkblue;
}

img{
    display:block;
    margin:auto;
    width:150px;
    height:150px;
    border-radius:50%;
    border:4px solid blue;
    box-shadow:0 0 10px gray;
    transition:0.5s;
}

img:hover{
    transform:scale(1.1);
}

.info{
    font-size:18px;
    margin-top:20px;
}

h2{
    color:darkred;
}

#skills{
    text-decoration:underline;
}

.skills{
    list-style-type:square;
    color:blue;
}

.skills li{
    margin-bottom:10px;
}

.hobbies{
    list-style-type:upper-roman;
    color:green;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>Student Profile</h1>

<img src="https://via.placeholder.com/150" alt="Profile Image">

<div class="info">
<p><b>Name:</b> Sumit Mahato</p>
<p><b>Course:</b> Web Development</p>
</div>

<h2 id="skills">Skills</h2>

<ul class="skills">
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
    <li>Bootstrap</li>
</ul>

<h2>Hobbies</h2>

<ol class="hobbies">
    <li>Reading</li>
    <li>Travelling</li>
    <li>Photography</li>
</ol>

</div>

</body>
</html>
